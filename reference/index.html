<script>
// Очередной костыль, чтобы когда окно браузера не раскрыт на весь вертикальный экран (смотрят на горизонтальном)
// таблица картинок прилеплялась верхним рядом к окну браузера
// иначе по умолчанию она центруется серединой своей таблицы по вертикальной середине экрана
(function() {
    function adjustCentering() {
        var container = document.querySelector('.container');
        if (!container) return;
        
        // Полная высота контента внутри .container (с учётом padding и содержимого)
        var containerHeight = container.scrollHeight;
        var viewportHeight = window.innerHeight;
        
        if (containerHeight > viewportHeight) {
            // Контент не помещается — прижимаем к верху и скроллим в начало
            document.body.classList.add('overflow-top');
            if (window.scrollY !== 0) {
                window.scrollTo(0, 0);
            }
        } else {
            // Всё помещается — центрируем
            document.body.classList.remove('overflow-top');
        }
    }
    
    // Отслеживаем загрузку всех картинок в сетке (они могут влиять на высоту)
    function bindImageLoads() {
        var images = document.querySelectorAll('.grid-item img');
        for (var i = 0; i < images.length; i++) {
            var img = images[i];
            if (img.complete) {
                // Уже загружена — всё равно можно вызвать (но избегаем лишних)
                continue;
            }
            img.addEventListener('load', adjustCentering);
            img.addEventListener('error', adjustCentering);
        }
    }
    
    // Запускаем при полной загрузке страницы и при изменении размеров окна
    window.addEventListener('load', function() {
        adjustCentering();
        bindImageLoads();
    });
    window.addEventListener('resize', adjustCentering);
    
    // Дополнительно запустим один раз после небольшой задержки (на случай динамических изменений)
    setTimeout(adjustCentering, 100);
})();
</script>






<script>
//тут код вызова fancybox, а бОльшая часть кода пытается рещить проблему, что когда мы переключаем язык, то первый переход между скульптурами почему-то возвращает 
//язык на старый и только последующие переходы включают нужный язык
//проблема решается топорно - при первом переходе после переключения языка мы обновляем iframe (он мигает), при последующих просто срабатывает смена встроенная в fancybox
//и так до нового переключения языка


    // Функция получения текущего языка
    function getCurrentLanguage() {
        return localStorage.getItem('selectedLanguage') || 'it';
    }

    // Хранилище для iframe элементов
    var iframeCache = {};
    var lastLanguage = getCurrentLanguage();
    var pendingReload = false; // флаг: нужно ли перезагрузить следующий слайд

    // Слушаем изменения языка в localStorage (если язык поменяли в другом iframe)
    window.addEventListener('storage', function(e) {
        if (e.key === 'selectedLanguage') {
            lastLanguage = e.newValue;
            pendingReload = true; // следующий слайд перезагрузим
        }
    });

    Fancybox.bind('[data-fancybox="gallery"]', {
        type: 'iframe',
        iframe: {
            preload: false,
            css: {
                width: '80vw',
                height: '80vh'
            }
        },
        animated: true,
        showClass: 'f-zoomInUp',
        hideClass: 'f-zoomOutDown',
        closeButton: 'auto',
        dragToClose: true,
        
        Carousel: {
            preload: 0
        },
        
        // При каждом показе слайда
        beforeShow: function(fancybox, slide) {
            if (slide && slide.src) {
                var currentLang = getCurrentLanguage();
                var needReload = pendingReload || (currentLang !== lastLanguage);
                
                if (needReload) {
                    // Язык изменился — перезагружаем этот слайд
                    var url = new URL(slide.src, window.location.href);
                    url.searchParams.set('lang', currentLang);
                    url.searchParams.set('_t', Date.now());
                    
                    var newSrc = url.toString();
                    
                    if (slide.src !== newSrc) {
                        slide.src = newSrc;
                        
                        // Перезагружаем iframe если он уже существует
                        if (iframeCache[slide.index]) {
                            var iframe = iframeCache[slide.index];
                            if (iframe && iframe.contentWindow) {
                                iframe.contentWindow.location.href = newSrc;
                            }
                        }
                    }
                    
                    // Сбрасываем флаги — последующие слайды не перезагружаем
                    pendingReload = false;
                    lastLanguage = currentLang;
                }
                // Если язык не менялся — ничего не делаем, используем кеш
            }
        },
        
        // Сохраняем iframe после создания
        afterLoad: function(fancybox, slide) {
            if (slide.type === 'iframe' && slide.iframe) {
                iframeCache[slide.index] = slide.iframe;
            }
        },
        
        // Очищаем кеш при закрытии
        on: {
            'close': function() {
                iframeCache = {};
                pendingReload = false;
            }
        }
    });
</script>
