<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="baiduspider" content="noindex, nofollow">
    <title>Biography</title>
    <link rel="stylesheet" href="language-switcher.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="card-grid-page.css">
    <link rel="stylesheet" href="ai-translated-review.css">
    <link rel="stylesheet" href="fancybox/fancybox.css">
    <link rel="stylesheet" href="fancybox/fancybox-override.css?v=docs-invite-tight">
    
    <script src="fancybox/fancybox.umd.js"></script>
    <script src="BIO/photos-list.js?v=docs-sync-press75"></script>
    <script src="BIO/documents-list.js?v=docs-lessico-break"></script>
    <script src="BIO/press-list.js?v=docs-sync-press75"></script>
    <script src="fancybox/no-translation-captions.js"></script>
    <script src="fancybox/fancybox-override.js?v=docs-photo-bottom2"></script>
    <script src="language-switcher.js" defer></script>
    <style>
        /* ref page2 — erase this block to revert */
        :root {
            --canvas-bg: #08080a;
            --bg: #08080a;
            --card-bg: #b2b2b2;
        }
        /* avg image 722.5×462.5 @3840 */
        .card-image {
            aspect-ratio: 289 / 185;
        }
        /* Documenti: shift image down 10% inside unchanged frame */
        .bio-item--documents .card-image {
            object-position: center 35%;
        }
    </style>
</head>
<body oncontextmenu="return false;">
<script>document.oncontextmenu = function() { return false; };</script>
    <div class="container">
        <input type="radio" name="lang" id="lang-it" class="lang-radio" hidden>
        <input type="radio" name="lang" id="lang-en" class="lang-radio" checked hidden>

        <div class="page card-page">
            <div class="card-panel">
                <h1 class="card-title">
                    <span class="lang-it">BIOGRAFIA</span>
                    <span class="lang-en">BIOGRAPHY</span>
                </h1>

                <div class="card-grid">
                    <a class="card-item" href="BIO/bio-text.html" data-fancybox="bio" data-type="iframe">
                        <div class="card-label">
                            <span class="lang-it">BIO</span>
                            <span class="lang-en">BIO</span>
                        </div>
                        <img class="card-image" src="BIO/bio_1.png" alt="Bio">
                    </a>
                    <a class="card-item bio-item--photos" href="BIO/photos/01.jpg">
                        <div class="card-label">
                            <span class="lang-it ai-translated" data-ai-id="bio-label-foto-it">FOTO</span>
                            <span class="lang-en">PHOTO</span>
                        </div>
                        <img class="card-image" src="BIO/bio_2.png" alt="Photo">
                    </a>
                    <div id="bio-photos-gallery" hidden aria-hidden="true"></div>
                    <a class="card-item bio-item--documents" href="BIO/documents/1/00000001.jpg">
                        <div class="card-label">
                            <span class="lang-it ai-translated" data-ai-id="bio-label-documenti-it">DOCUMENTI</span>
                            <span class="lang-en">DOCUMENTS</span>
                        </div>
                        <img class="card-image" src="BIO/bio_3.png" alt="Documents">
                    </a>
                    <div id="bio-documents-gallery" hidden aria-hidden="true"></div>
                    <a class="card-item bio-item--press" href="BIO/press/01.jpg">
                        <div class="card-label">
                            <span class="lang-it ai-translated" data-ai-id="bio-label-stampa-it">STAMPA</span>
                            <span class="lang-en">PRESS</span>
                        </div>
                        <img class="card-image" src="BIO/bio_4.png" alt="Press">
                    </a>
                    <div id="bio-press-gallery" hidden aria-hidden="true"></div>
                </div>

                <div class="switchers-row">
                    <div class="css-switcher">
                        <div class="switcher-left">
                            <label for="lang-en" class="switcher-label switcher-label--toggle-en">LANGUAGE</label>
                            <label for="lang-it" class="switcher-label switcher-label--toggle-it">Lingua</label>
                        </div>
                        <div class="switcher-divider"></div>
                        <div class="switcher-right">
                            <label for="lang-it" class="circle it-circle">IT</label>
                            <label for="lang-en" class="circle en-circle">EN</label>
                        </div>
                    </div>

                    <a href="index.html" class="nav-switcher" aria-label="Navigation">
                        <div class="nav-switcher-left">
                            <span class="nav-label">MENU</span>
                        </div>
                        <div class="nav-divider"></div>
                        <div class="nav-switcher-right">
                            <span class="nav-home">HOME</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
