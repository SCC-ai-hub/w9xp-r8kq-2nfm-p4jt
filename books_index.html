<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="baiduspider" content="noindex, nofollow">
    <title>Publications</title>
    <link rel="stylesheet" href="language-switcher.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="books_hub.css">
    <script src="language-switcher.js" defer></script>
</head>
<body oncontextmenu="return false;">
<script>document.oncontextmenu = function() { return false; };</script>
    <div class="container">
        <input type="radio" name="lang" id="lang-it" class="lang-radio" hidden>
        <input type="radio" name="lang" id="lang-en" class="lang-radio" checked hidden>

        <div class="page">
            <nav class="hub-list" aria-label="Publications">
                <a class="hub-item" href="books_libri.html">
                    <span class="hub-tile">
                        <img src="books/Prošedšee vremja nesoveršennogo vida_2ed.jpg" alt="">
                    </span>
                    <span class="hub-label">
                        <span class="lang-it">Libri di Bruskin</span>
                        <span class="lang-en">Books by Bruskin</span>
                    </span>
                </a>
                <a class="hub-item hub-item--mono" href="books_monografie.html">
                    <span class="hub-tile">
                        <img src="books/Silvia Burini - Grisha Bruskin Lessico Fondamentale.jpg" alt="">
                    </span>
                    <span class="hub-label">
                        <span class="lang-it">Monografie e cataloghi</span>
                        <span class="lang-en">Monographs and Catalogues</span>
                    </span>
                </a>
            </nav>

            <div class="switchers-row">
                <div class="css-switcher">
                    <div class="switcher-left">
                        <label for="lang-en" class="switcher-label switcher-label--toggle-en">LANGUAGE</label>
                        <label for="lang-it" class="switcher-label switcher-label--toggle-it">Lingua</label>
                    </div>
                    <div class="switcher-divider"></div>
                    <div class="switcher-right">
                        <label for="lang-it" class="circle it-circle">IT</label>
                        <label for="lang-en" class="circle en-circle">EN</label>
                    </div>
                </div>

                <a href="index.html" class="nav-switcher" aria-label="Navigation">
                    <div class="nav-switcher-left">
                        <span class="nav-label">MENU</span>
                    </div>
                    <div class="nav-divider"></div>
                    <div class="nav-switcher-right">
                        <span class="nav-home">HOME</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.hub-item').forEach(function (link) {
            link.addEventListener('click', function (e) {
                if (link.classList.contains('hub-item--pressed')) return;
                e.preventDefault();
                link.classList.add('hub-item--pressed');
                var href = link.getAttribute('href');
                setTimeout(function () {
                    window.location.href = href;
                }, 200);
            });
        });
    </script>
</body>
</html>
