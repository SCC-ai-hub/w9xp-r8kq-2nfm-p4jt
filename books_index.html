<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="baiduspider" content="noindex, nofollow">
    <title>Publications</title>
    <link rel="stylesheet" href="language-switcher.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="page-arrows.css">
    <link rel="stylesheet" href="card-grid-page.css">
    <link rel="stylesheet" href="books_index.css">
    <link rel="stylesheet" href="fancybox/fancybox.css">
    <link rel="stylesheet" href="fancybox/fancybox-override.css">
    <script src="fancybox/fancybox.umd.js"></script>
    <script src="books/books-list.js"></script>
    <script src="fancybox/fancybox-override.js"></script>
    <script src="language-switcher.js" defer></script>
    <script src="scroll-grid.js" defer></script>
    <script src="books-flip.js" defer></script>
    <style>
        /* ref page4 — erase this block to revert */
        :root {
            --canvas-bg: #08080a;
            --bg: #08080a;
            --card-bg: #ededed;
        }
    </style>
</head>
<body oncontextmenu="return false;">
<script>document.oncontextmenu = function() { return false; };</script>
    <div class="container">
        <input type="radio" name="lang" id="lang-it" class="lang-radio" hidden>
        <input type="radio" name="lang" id="lang-en" class="lang-radio" checked hidden>

        <div class="page card-page">
            <button type="button" class="page-arrow page-arrow--prev" data-scroll-prev aria-label="Scroll left">
                <svg class="page-arrow__icon" viewBox="0 0 128 62" aria-hidden="true">
                    <path d="M120 31H8M36 3L8 31l28 28" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button type="button" class="page-arrow page-arrow--next" data-scroll-next aria-label="Scroll right">
                <svg class="page-arrow__icon" viewBox="0 0 128 62" aria-hidden="true">
                    <path d="M8 31h112M92 3l28 28-28 28" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <div class="card-panel card-panel--scroll books-panel">
                <h1 class="card-title">
                    <span class="lang-it">PUBBLICAZIONI</span>
                    <span class="lang-en">PUBLICATIONS</span>
                </h1>

                <div class="books-scroll" data-scroll-area data-scroll-axis="x" data-scroll-mode="group" data-scroll-cols="4" data-scroll-item=".book-item">
                    <div class="books-viewport" data-scroll-grid>
                        <div class="books-track">

                            <a class="book-item book-item--trigger" href="books/Prošedšee vremja nesoveršennogo vida.jpg">
                                <img class="book-cover" src="books/Prošedšee vremja nesoveršennogo vida.jpg" alt="" data-book-first decoding="sync" fetchpriority="high" loading="eager" style="--book-ar: 2443 / 4043;">
                            </a>
                            <div id="books-gallery" hidden aria-hidden="true"></div>

                        </div>
                    </div>
                </div>

                <div class="switchers-row">
                    <div class="css-switcher">
                        <div class="switcher-left">
                            <label for="lang-en" class="switcher-label switcher-label--toggle-en">LANGUAGE</label>
                            <label for="lang-it" class="switcher-label switcher-label--toggle-it">Lingua</label>
                        </div>
                        <div class="switcher-divider"></div>
                        <div class="switcher-right">
                            <label for="lang-it" class="circle it-circle">IT</label>
                            <label for="lang-en" class="circle en-circle">EN</label>
                        </div>
                    </div>

                    <a href="index.html" class="nav-switcher" aria-label="Navigation">
                        <div class="nav-switcher-left">
                            <span class="nav-label">MENU</span>
                        </div>
                        <div class="nav-divider"></div>
                        <div class="nav-switcher-right">
                            <span class="nav-home">HOME</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
