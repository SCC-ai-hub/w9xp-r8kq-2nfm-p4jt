<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="baiduspider" content="noindex, nofollow">
    <title>Menu</title>
    <link rel="stylesheet" href="language-switcher.css">
    <link rel="stylesheet" href="index.css">
    <script src="language-switcher.js" defer></script>
</head>
<body oncontextmenu="return false;">
<script>document.oncontextmenu = function() { return false; };</script>
    <div class="container">
        <input type="radio" name="lang" id="lang-it" class="lang-radio" hidden>
        <input type="radio" name="lang" id="lang-en" class="lang-radio" checked hidden>

        <div class="page">
            <nav class="menu-list" aria-label="Main">
                <div class="menu-row menu-row--top">
                    <a class="menu-item" href="bio_index.html">
                        <span class="menu-circle">
                            <img src="bio.png" alt="">
                        </span>
                        <span class="menu-label">
                            <span class="lang-it">Biografia</span>
                            <span class="lang-en">Biography</span>
                        </span>
                    </a>
                    <a class="menu-item" href="artworks_index.html">
                        <span class="menu-circle">
                            <img src="artworks.png" alt="">
                        </span>
                        <span class="menu-label">
                            <span class="lang-it">Opere</span>
                            <span class="lang-en">Art Works</span>
                        </span>
                    </a>
                    <a class="menu-item" href="books_index.html">
                        <span class="menu-circle">
                            <img src="books.png" alt="">
                        </span>
                        <span class="menu-label">
                            <span class="lang-it">Pubblicazioni</span>
                            <span class="lang-en">Publications</span>
                        </span>
                    </a>
                </div>

                <div class="menu-row menu-row--bottom">
                    <a class="menu-item" href="questions-video.html">
                        <span class="menu-circle">
                            <img src="questions-video.png" alt="">
                        </span>
                        <span class="menu-label">
                            <span class="lang-it">Chiedi all'artista</span>
                            <span class="lang-en">Ask the Artist</span>
                        </span>
                    </a>
                    <a class="menu-item" href="films_index.html">
                        <span class="menu-circle">
                            <img src="films.png" alt="">
                        </span>
                        <span class="menu-label">
                            <span class="lang-it">Interviste e film</span>
                            <span class="lang-en">Interviews and Films</span>
                        </span>
                    </a>
                </div>
            </nav>

            <div class="css-switcher">
                <div class="switcher-left">
                    <label for="lang-en" class="switcher-label switcher-label--toggle-en">LANGUAGE</label>
                    <label for="lang-it" class="switcher-label switcher-label--toggle-it">Lingua</label>
                </div>
                <div class="switcher-divider"></div>
                <div class="switcher-right">
                    <label for="lang-it" class="circle it-circle">IT</label>
                    <label for="lang-en" class="circle en-circle">EN</label>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.menu-item').forEach(function (link) {
            link.addEventListener('click', function (e) {
                if (link.classList.contains('menu-item--pressed')) return;
                e.preventDefault();
                link.classList.add('menu-item--pressed');
                var href = link.getAttribute('href');
                setTimeout(function () {
                    window.location.href = href;
                }, 200);
            });
        });
    </script>
</body>
</html>
